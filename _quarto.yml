project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "posts/**/*.qmd"

website:
  title: "Jyoti Ranjan"
  site-url: "https://jyotiranjan.dev"
  description: "Jyoti Ranjan — GenAI architect building production AI systems and the security & evidence layer they need to be trusted. Writing on MCP/agent security, applied LLMs, and voice AI."
  favicon: images/favicon.png
  open-graph: true
  twitter-card:
    card-style: summary_large_image
  image: images/og-default.png
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: projects.qmd
        text: Projects
      - href: blog.qmd
        text: Blog
      - href: about.qmd
        text: About
      - href: contact.qmd
        text: Contact
    right:
      - icon: github
        href: https://github.com/tell2jyoti
      - icon: linkedin
        href: https://www.linkedin.com/in/jyoti-ranjan-panda-0667645/

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, brand.scss]
      dark:  [darkly, theme-dark.scss, brand.scss]
    toc: false
    page-layout: article
    max-width: 900px
